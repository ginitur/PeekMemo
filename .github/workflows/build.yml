name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --product PeekMemo

      - name: Test
        run: swift run PeekMemoCoreTests
